<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- REZ mark: a 4:3 frame, slanted like the poster titles, pulled wide by two blue wedges. -->
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="#000"/>
  <circle cx="512" cy="512" r="420" fill="url(#halo)"/>
  <g transform="translate(512 512) skewX(-12) translate(-512 -512)">
    <rect x="322" y="362" width="380" height="300" rx="44" fill="none" stroke="#fff" stroke-width="64"/>
    <path d="M262 512 L132 392 L132 632 Z" fill="url(#blue)" stroke="url(#blue)" stroke-width="28" stroke-linejoin="round"/>
    <path d="M762 512 L892 392 L892 632 Z" fill="url(#blue)" stroke="url(#blue)" stroke-width="28" stroke-linejoin="round"/>
  </g>
</svg>
