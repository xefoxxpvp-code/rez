name: Release

# Push a tag like v0.2.1 to build, sign and publish REZ. The app checks
# releases/latest/download/latest.json and updates itself in place.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npx vitest run
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: REZ ${{ github.ref_name }}
          releaseBody: "Mise à jour de REZ : installe-la depuis l app, bouton Mettre à jour."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
